<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="min-height: 500px">
    <form id="loginForm" class="mt-5" style="max-width: 420px" autocomplete="on">
        <h3 class="mb-3">Login</h3>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control mb-2" required="required">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control mb-3" required="required" autocomplete="on">
        <button id="Login" type="submit" class="btn btn-primary">Login</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
